name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not slow and not e2e"

  portable:
    # Spokecut is used on Macs and Windows machines too, so run the unit tests there. The browser tests stay on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow and not e2e"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/js/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      # Playwright's bundled Chromium has no AAC decoder, and the demo clip is AAC, so use Chrome.
      - run: playwright install --with-deps chrome
      - run: pytest -m e2e
        env:
          SPOKECUT_BROWSER_CHANNEL: chrome

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Wheel ships the web app and the demo
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'spokecut/web/index.html'
          python -m zipfile -l dist/*.whl | grep -q 'spokecut/web/demo/project.json'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
