[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spokecut"
version = "0.2.0"
description = "Edit talking video by editing its transcript, on your own machine. Delete words to cut them, drop pauses and repeats, burn in captions, export EDL, FCPXML and OTIO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arthur031221" }]
keywords = ["video-editing", "whisper", "transcript", "captions", "fcpxml", "edl", "descript-alternative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "playwright>=1.45", "OpenTimelineIO-Plugins>=0.17", "otio-fcpx-xml-adapter>=1.0"]

[project.scripts]
spokecut = "spokecut.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur031221/Spokecut"
Issues = "https://github.com/Arthur031221/Spokecut/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spokecut"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "spokecut/web"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real Whisper weights (deselect with -m 'not slow')", "e2e: drives a real browser"]
